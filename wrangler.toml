# Cloudflare Worker + static assets (Vite output in ./dist).
# Entry: worker.ts serves ASSETS and POST /api/contact (same behavior as Pages Functions).
#
# This file is the DEFAULT for `npx wrangler deploy` (e.g. Cloudflare Pages “Deploy command”).
# Do not add `pages_build_output_dir` here — Wrangler then treats the project as Pages-only
# and `wrangler deploy` fails with “Missing entry-point”.
#
# Git-connected Pages: keep Build output directory = `dist` in the dashboard. Pages still
# uploads that folder and bundles `functions/`; this Worker config is only for wrangler deploy.
#
# Secrets: Pages → bun run cf:secrets:push | Worker script → bun run cf:worker:secrets:push
# https://developers.cloudflare.com/workers/static-assets/binding/

"$schema" = "node_modules/wrangler/config-schema.json"

name = "website"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
