# Cloudflare Pages + Functions (see functions/api/contact.ts).
# For the standalone Worker at *.workers.dev, use wrangler.worker.toml + `bun run cf:worker:deploy`.
#
# `name` MUST match the Pages project slug (Workers & Pages → your site → name in the URL bar).
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# IMPORTANT (Git-connected Pages): Settings → Builds & deployments
#   - Build command: bun run build
#   - Build output directory: dist
#   - Deploy command — pick ONE:
#       (A) Leave EMPTY (recommended). Pages publishes dist + functions/; do not run wrangler deploy.
#       (B) If you must run Wrangler: bun run cf:ci:deploy
#           (= wrangler deploy --config wrangler.worker.toml). Plain `npx wrangler deploy` will FAIL
#           because this file is Pages-only (no main/assets).
#   You cannot merge pages_build_output_dir + main in one wrangler.toml; Wrangler rejects it.

"$schema" = "node_modules/wrangler/config-schema.json"

name = "website"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# Required at runtime for /api/contact (set via dashboard or CLI — do not commit values):
#   RESEND_API_KEY, CONTACT_INBOX_EMAIL  (secrets)
#   RESEND_FROM_EMAIL                    (optional; can be plain Text in dashboard)
# Pages does not support [secrets] in wrangler.toml — use `bun run cf:secret:put` (see package.json).
# Local Pages dev: copy .dev.vars.example → .dev.vars (gitignored).

# Optional non-sensitive config can use plain Text in the dashboard, for example:
#   RESEND_FROM_EMAIL=mail@your-verified-domain.com
# Never commit real API keys under [vars].
