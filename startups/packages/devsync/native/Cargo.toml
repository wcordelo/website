[workspace]
resolver = "2"
members = [
    "crates/devsync-core",
    "crates/devsync-ignore",
    "crates/devsync-transport",
    "crates/devsync-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theo/devsync"

[workspace.dependencies]
blake3 = "1"
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
