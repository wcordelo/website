name: Better npm audit
description: Run bnpm blocklist check and pipeline audit on pull requests
branding:
  icon: shield
  color: green

inputs:
  policy:
    description: Path to .better-npmrc
    required: false
    default: .better-npmrc
  fail-on:
    description: Fail on block or warn
    required: false
    default: block
  working-directory:
    description: Working directory for audit
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install bnpm
      shell: bash
      run: bun install --cwd "${{ github.action_path }}/.." 2>/dev/null || npm install -g @theo-startups/bnpm@0.1.0 || true

    - name: Blocklist pre-check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if command -v bnpm >/dev/null 2>&1; then
          bnpm install --dry-run 2>/dev/null || bnpm ci --json || true
        else
          bun run "${{ github.action_path }}/../src/cli.ts" ci --json || true
        fi

    - name: Pipeline audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        SARIF="bnpm-pipeline.sarif"
        if command -v bnpm >/dev/null 2>&1; then
          bnpm audit-pipeline --sarif "$SARIF" --json
        else
          bun run "${{ github.action_path }}/../src/cli.ts" audit-pipeline --sarif "$SARIF" --json
        fi

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: ${{ inputs.working-directory }}/bnpm-pipeline.sarif
