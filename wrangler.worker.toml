# Standalone Worker (matches Workers dashboard: website.*.workers.dev).
# Use this when you deploy with `wrangler deploy`, not Git-connected Pages.
# https://developers.cloudflare.com/workers/static-assets/binding/

"$schema" = "node_modules/wrangler/config-schema.json"

name = "website"
main = "worker.ts"
compatibility_date = "2025-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker first so /api/contact is handled in worker.ts; everything else uses ASSETS.
run_worker_first = true
